spring.application.name=kosmo163_boot
server.port=80

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ------ DB 정보
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREE
spring.datasource.username=CNS
spring.datasource.password=CNS


# 1. 카멜케이스 설정 (기존 설정 유지)
mybatis.configuration.map-underscore-to-camel-case=true

# 2. 별칭(Type Aliases) 설정 (XML 대신 여기서 처리)
# 해당 패키지 아래의 모든 클래스를 클래스명으로 별칭 등록해줍니다.
mybatis.type-aliases-package=com.gguek.app


# ------ File 관리
# multipart 사용 여부
spring.servlet.multipart.enabled=true
# 파일 하나당 최대 크기 설정 제한
spring.servlet.multipart.max-file-size=10MB
# 총 파일의 최대 크기 설정 제한
spring.servlet.multipart.max-request-size=100MB


#--- 파일 저장 관리
app.upload.base=/upload/

app.upload.path=file:///Users/han/upload/

#--- 파일 위치를 연결할 가상의 URL
app.upload.url=/files/**


# ---
app.board.notice=notice

